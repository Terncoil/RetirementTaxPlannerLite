name: build apps

# Builds the stand-alone app on each OS with PyInstaller, checks that it
# starts and carries the right version, and uploads it as a download.
#
# * Every push to main: fresh builds on the run's page (kept 30 days). If
#   the repository variable AUTO_RELEASE is true and the version in
#   src/rtpl/__init__.py has no release yet, the builds are also published
#   as GitHub Release v<version>, which stays for good. AUTO_RELEASE unset
#   or false = builds only (for example while a feature is half done).
# * A tag v<version> pushed by hand: the same release, for that commit.
# * Pull requests that touch packaging (not while they are drafts), and
#   "Run workflow" by hand.
#
# macOS is built only when the repository variable MACOS_BUILDS is true, or
# when "Run workflow" is started with macOS ticked. The repository is
# public, so set MACOS_BUILDS to true and leave it. See docs/packaging.md.
on:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build for macOS"
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packaging/**"
      - "src/rtpl/app/**"
      - "src/rtpl/__init__.py"
      - "src/rtpl/data/icons/**"
      - "pyproject.toml"
      - "examples/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

# A new push to a pull request cancels its older, unfinished builds. Runs on
# main and on tags are never cancelled, so no release is cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reads the version, and decides whether this run publishes a release.
  version:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          AUTO_RELEASE: ${{ vars.AUTO_RELEASE }}
        run: |
          version=$(python3 packaging/version.py)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version in src/rtpl/__init__.py"
              exit 1
            fi
            release=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            if [ "$AUTO_RELEASE" != true ]; then
              echo "Automatic releases are off (repository variable AUTO_RELEASE is not true); builds only."
            elif gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "Release v$version already exists; builds only."
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, release: $release"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        exclude:
          - os: ${{ (vars.MACOS_BUILDS == 'true' || inputs.macos) && 'none' || 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install . pyinstaller
      - name: Package metadata has the same version
        shell: bash
        run: |
          meta=$(python -c "from importlib.metadata import version; print(version('retirement-tax-planner-lite'))")
          [ "$meta" = "$VERSION" ] || { echo "::error::Package metadata says $meta, __version__ says $VERSION"; exit 1; }
      - run: pyinstaller packaging/rtpl.spec --noconfirm
      - name: Built app has the same version
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows)
              got=$(powershell -NoProfile -Command "(Get-Item dist/RetirementTaxPlannerLite/RetirementTaxPlannerLite.exe).VersionInfo.ProductVersion" | tr -d '\r') ;;
            macOS)
              got=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/RetirementTaxPlannerLite.app/Contents/Info.plist) ;;
            *)
              echo "Linux executables carry no version resource."; exit 0 ;;
          esac
          echo "Built app version: $got"
          [ "$got" = "$VERSION" ] || { echo "::error::Built app says $got, __version__ says $VERSION"; exit 1; }
      - name: Start the built app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            macOS) exe=dist/RetirementTaxPlannerLite.app/Contents/MacOS/RetirementTaxPlannerLite ;;
            Windows) exe=dist/RetirementTaxPlannerLite/RetirementTaxPlannerLite.exe ;;
            *) exe=dist/RetirementTaxPlannerLite/RetirementTaxPlannerLite ;;
          esac
          "$exe" & pid=$!
          sleep 15
          kill -0 $pid   # still running means it started without crashing
          kill $pid || true
      # The examples folder goes next to the app, where people can see it
      # and open its files with File > Open. On macOS it can't go inside the
      # .app (Finder hides that), so the zip holds a folder with the app and
      # the examples side by side.
      - name: Zip
        shell: bash
        run: |
          zip="RetirementTaxPlannerLite-$VERSION-$RUNNER_OS.zip"
          cd dist
          if [ "$RUNNER_OS" = macOS ]; then
            mkdir -p package/RetirementTaxPlannerLite
            ditto RetirementTaxPlannerLite.app package/RetirementTaxPlannerLite/RetirementTaxPlannerLite.app
            cp -R ../examples package/RetirementTaxPlannerLite/examples
            ditto -c -k --keepParent package/RetirementTaxPlannerLite "../$zip"
          else
            cp -R ../examples RetirementTaxPlannerLite/examples
            7z a -r "../$zip" RetirementTaxPlannerLite > /dev/null
          fi
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: RetirementTaxPlannerLite-${{ runner.os }}
          path: ${{ env.ZIP }}
          retention-days: 30

  # Publishes the three zips as GitHub Release v<version>.
  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          # A release already made by hand for this tag just gets the zips.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" zips/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          gh release create "$TAG" zips/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RetirementTaxPlannerLite ${TAG#v}" \
            --generate-notes
