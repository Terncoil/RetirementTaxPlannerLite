name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: "Also test on macOS"
        type: boolean
        default: false

# A new push to a pull request cancels its older, unfinished runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
        # macOS runs only when the repository variable MACOS_BUILDS is
        # true, or when "Run workflow" is started with macOS ticked
        # (see docs/packaging.md).
        exclude:
          - os: ${{ (vars.MACOS_BUILDS == 'true' || inputs.macos) && 'none' || 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # A pull request that changes the app must raise its version, so each
  # merge publishes a new release (see docs/packaging.md).
  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version is higher than on the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD -- src packaging pyproject.toml)
          if [ -z "$changed" ]; then
            echo "No app files changed; no version bump needed."
            exit 0
          fi
          git show "$BASE:src/rtpl/__init__.py" > /tmp/base_init.py
          base=$(python3 packaging/version.py --of /tmp/base_init.py)
          python3 packaging/version.py --newer-than "$base"
