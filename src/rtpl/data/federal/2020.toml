# Federal tax law for tax year 2020 (historical). See 2025.toml for the
# format notes.
#
# The CARES Act waived all 2020 RMDs, and 2020 RMDs used the older IRS
# life expectancy tables. The app models neither yet, so a forward plan
# that starts in 2020 takes RMDs it should not. The single-year tax math
# (the marginal graph) is exact.

year = 2020
status = "enacted"
sources = [
  "IRS Rev. Proc. 2019-44 (inflation adjustments)",
  "CMS 2020 Medicare Parts B and D premium fact sheets",
  "HHS 2019 poverty guidelines (used for 2020 ACA coverage)",
]

[policy]
personal_exemption = 0.0                 # 0 under TCJA (2018-2025)
senior_deduction = false                 # the OBBBA senior deduction starts in 2025
# Before ARPA: the 400% FPL subsidy cliff applied.
aca_enhanced_subsidies = false

[ordinary_brackets]
single = [[0, 0.10], [9875, 0.12], [40125, 0.22], [85525, 0.24], [163300, 0.32], [207350, 0.35], [518400, 0.37]]
mfj    = [[0, 0.10], [19750, 0.12], [80250, 0.22], [171050, 0.24], [326600, 0.32], [414700, 0.35], [622050, 0.37]]
mfs    = [[0, 0.10], [9875, 0.12], [40125, 0.22], [85525, 0.24], [163300, 0.32], [207350, 0.35], [311025, 0.37]]
hoh    = [[0, 0.10], [14100, 0.12], [53700, 0.22], [85500, 0.24], [163300, 0.32], [207350, 0.35], [518400, 0.37]]

[standard_deduction]
single = 12400
mfj    = 24800
mfs    = 12400
hoh    = 18650

[additional_standard_deduction]
unmarried = 1650
married   = 1300

[senior_deduction]
# Not in effect this year (policy.senior_deduction is false and the
# law's first year is 2025). Kept so the file has the same shape.
amount_per_person = 6000
phaseout_rate     = 0.06
phaseout_per_person = true
first_year = 2025
last_year  = 2028
mfs_eligible = false
phaseout_start = { single = 75000, mfj = 150000, mfs = 75000, hoh = 75000 }

[capital_gains]
single = [[0, 0.0], [40000, 0.15], [441450, 0.20]]
mfj    = [[0, 0.0], [80000, 0.15], [496600, 0.20]]
mfs    = [[0, 0.0], [40000, 0.15], [248300, 0.20]]
hoh    = [[0, 0.0], [53600, 0.15], [469050, 0.20]]
capital_loss_limit = { single = 3000, mfj = 3000, mfs = 1500, hoh = 3000 }

[niit]
rate = 0.038
threshold = { single = 200000, mfj = 250000, mfs = 125000, hoh = 200000 }

[social_security]
base     = { single = 25000, mfj = 32000, mfs = 0, hoh = 25000 }
adjusted = { single = 34000, mfj = 44000, mfs = 0, hoh = 34000 }
earnings_test = { under_fra = 18240, fra_year = 48600 }

[irmaa]
# Medicare premiums paid in 2020, set by MAGI from 2018.
premium_year = 2020
lookback_years = 2
part_b_standard = 144.60
tiers = [
  { single = 87000, mfj = 174000, mfs = 87000, part_b = 202.40, part_d = 12.20 },
  { single = 109000, mfj = 218000, mfs = 87000, part_b = 289.20, part_d = 31.50 },
  { single = 136000, mfj = 272000, mfs = 87000, part_b = 376.00, part_d = 50.70 },
  { single = 163000, mfj = 326000, mfs = 87000, part_b = 462.70, part_d = 70.00 },
  { single = 500000, mfj = 750000, mfs = 413000, part_b = 491.60, part_d = 76.40 },
]

[aca]
fpl_first_person = 12490
fpl_each_additional = 4420
medicaid_expansion_pct = 1.38
csr_limit_pct = 2.50
subsidy_cliff_pct = 4.00
# Premium tax credit: the share of income expected toward the benchmark
# (second-lowest-cost Silver) plan, by income as a multiple of the
# poverty line: [band start, initial %, final %], rising in a straight
# line across each band (Rev. Proc. 2019-29).
applicable_percentage = [[0.0, 0.0206, 0.0206], [1.33, 0.0309, 0.0412], [1.5, 0.0412, 0.0649], [2.0, 0.0649, 0.0829], [2.5, 0.0829, 0.0978], [3.0, 0.0978, 0.0978]]

[education_credits]
# American Opportunity credit (IRC 25A(b), (i)): per student, 100% of the
# first $2,000 of qualified expenses plus 25% of the next $2,000; 40% of it
# is refundable. Lifetime Learning credit: 20% of up to $10,000 of expenses
# per return, nonrefundable. Both phase out in a straight line over the
# MAGI range below (fixed in statute, not indexed). Married filing
# separately can't claim either.
aotc_full_expenses = 2000
aotc_partial_expenses = 2000
aotc_partial_rate = 0.25
aotc_refundable_share = 0.40
aotc_phaseout_start = { single = 80000, mfj = 160000, mfs = 0, hoh = 80000 }
aotc_phaseout_width = { single = 10000, mfj = 20000, mfs = 0, hoh = 10000 }
llc_rate = 0.20
llc_expense_limit = 10000
# The LLC had its own, lower phase-out until 2021.
llc_phaseout_start = { single = 59000, mfj = 118000, mfs = 0, hoh = 59000 }
llc_phaseout_width = { single = 10000, mfj = 20000, mfs = 0, hoh = 10000 }

[qcd]
# Qualified charitable distributions (IRC 408(d)(8)): the most each IRA
# owner aged 70 1/2 or older can give from their IRAs tax-free this year.
# Fixed at $100,000 in the statute until indexing began in 2024.
annual_limit = 100000
# SECURE 2.0 one-time gift to a charitable gift annuity or remainder
# trust (from 2023; inside the annual limit). 0 = not yet allowed.
split_interest_limit = 0

[hsa]
# Health savings account contribution limits (IRC 223(b)), for someone
# covered by a high-deductible health plan all year and not on Medicare.
# Indexed for inflation (Rev. Proc. 2019-25). The catch-up for those 55 or older
# by the end of the year is fixed in statute and goes only into the HSA
# of the person it belongs to.
self_only = 3550
family = 7100
catch_up = 1000
