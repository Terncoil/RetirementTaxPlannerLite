# Federal tax law for tax year 2024 (historical). See 2025.toml for the
# format notes.
#
# The marginal-graph tax math needs no code changes for this year.

year = 2024
status = "enacted"
sources = [
  "IRS Rev. Proc. 2023-34 (inflation adjustments)",
  "CMS 2024 Medicare Parts B and D premium fact sheets",
  "HHS 2023 poverty guidelines (used for 2024 ACA coverage)",
]

[policy]
personal_exemption = 0.0                 # 0 under TCJA (2018-2025)
senior_deduction = false                 # the OBBBA senior deduction starts in 2025
# ARPA's enhanced ACA credits applied (no 400% FPL cliff).
aca_enhanced_subsidies = true

[ordinary_brackets]
single = [[0, 0.10], [11600, 0.12], [47150, 0.22], [100525, 0.24], [191950, 0.32], [243725, 0.35], [609350, 0.37]]
mfj    = [[0, 0.10], [23200, 0.12], [94300, 0.22], [201050, 0.24], [383900, 0.32], [487450, 0.35], [731200, 0.37]]
mfs    = [[0, 0.10], [11600, 0.12], [47150, 0.22], [100525, 0.24], [191950, 0.32], [243725, 0.35], [365600, 0.37]]
hoh    = [[0, 0.10], [16550, 0.12], [63100, 0.22], [100500, 0.24], [191950, 0.32], [243700, 0.35], [609350, 0.37]]

[standard_deduction]
single = 14600
mfj    = 29200
mfs    = 14600
hoh    = 21900

[additional_standard_deduction]
unmarried = 1950
married   = 1550

[senior_deduction]
# Not in effect this year (policy.senior_deduction is false and the
# law's first year is 2025). Kept so the file has the same shape.
amount_per_person = 6000
phaseout_rate     = 0.06
phaseout_per_person = true
first_year = 2025
last_year  = 2028
mfs_eligible = false
phaseout_start = { single = 75000, mfj = 150000, mfs = 75000, hoh = 75000 }

[capital_gains]
single = [[0, 0.0], [47025, 0.15], [518900, 0.20]]
mfj    = [[0, 0.0], [94050, 0.15], [583750, 0.20]]
mfs    = [[0, 0.0], [47025, 0.15], [291850, 0.20]]
hoh    = [[0, 0.0], [63000, 0.15], [551350, 0.20]]
capital_loss_limit = { single = 3000, mfj = 3000, mfs = 1500, hoh = 3000 }

[niit]
rate = 0.038
threshold = { single = 200000, mfj = 250000, mfs = 125000, hoh = 200000 }

[social_security]
base     = { single = 25000, mfj = 32000, mfs = 0, hoh = 25000 }
adjusted = { single = 34000, mfj = 44000, mfs = 0, hoh = 34000 }
earnings_test = { under_fra = 22320, fra_year = 59520 }

[irmaa]
# Medicare premiums paid in 2024, set by MAGI from 2022.
premium_year = 2024
lookback_years = 2
part_b_standard = 174.70
tiers = [
  { single = 103000, mfj = 206000, mfs = 103000, part_b = 244.60, part_d = 12.90 },
  # Tier 2 Part D: SSA lists $33.30 for joint filers and $33.50 for single.
  { single = 129000, mfj = 258000, mfs = 103000, part_b = 349.40, part_d = 33.30 },
  { single = 161000, mfj = 322000, mfs = 103000, part_b = 454.20, part_d = 53.80 },
  { single = 193000, mfj = 386000, mfs = 103000, part_b = 559.00, part_d = 74.20 },
  { single = 500000, mfj = 750000, mfs = 397000, part_b = 594.00, part_d = 81.00 },
]

[aca]
fpl_first_person = 14580
fpl_each_additional = 5140
medicaid_expansion_pct = 1.38
csr_limit_pct = 2.50
subsidy_cliff_pct = 4.00
# Premium tax credit: the share of income expected toward the benchmark
# (second-lowest-cost Silver) plan, by income as a multiple of the
# poverty line: [band start, initial %, final %], rising in a straight
# line across each band (Inflation Reduction Act section 12001 (enhanced credits)).
applicable_percentage = [[0.0, 0.0, 0.0], [1.5, 0.0, 0.02], [2.0, 0.02, 0.04], [2.5, 0.04, 0.06], [3.0, 0.06, 0.085], [4.0, 0.085, 0.085]]

[education_credits]
# American Opportunity credit (IRC 25A(b), (i)): per student, 100% of the
# first $2,000 of qualified expenses plus 25% of the next $2,000; 40% of it
# is refundable. Lifetime Learning credit: 20% of up to $10,000 of expenses
# per return, nonrefundable. Both phase out in a straight line over the
# MAGI range below (fixed in statute, not indexed). Married filing
# separately can't claim either.
aotc_full_expenses = 2000
aotc_partial_expenses = 2000
aotc_partial_rate = 0.25
aotc_refundable_share = 0.40
aotc_phaseout_start = { single = 80000, mfj = 160000, mfs = 0, hoh = 80000 }
aotc_phaseout_width = { single = 10000, mfj = 20000, mfs = 0, hoh = 10000 }
llc_rate = 0.20
llc_expense_limit = 10000
llc_phaseout_start = { single = 80000, mfj = 160000, mfs = 0, hoh = 80000 }
llc_phaseout_width = { single = 10000, mfj = 20000, mfs = 0, hoh = 10000 }

[qcd]
# Qualified charitable distributions (IRC 408(d)(8)): the most each IRA
# owner aged 70 1/2 or older can give from their IRAs tax-free this year.
# First indexed year (IRS Notice 2023-75).
annual_limit = 105000
# SECURE 2.0 one-time gift to a charitable gift annuity or remainder
# trust (from 2023; inside the annual limit). 0 = not yet allowed.
split_interest_limit = 53000

[hsa]
# Health savings account contribution limits (IRC 223(b)), for someone
# covered by a high-deductible health plan all year and not on Medicare.
# Indexed for inflation (Rev. Proc. 2023-23). The catch-up for those 55 or older
# by the end of the year is fixed in statute and goes only into the HSA
# of the person it belongs to.
self_only = 4150
family = 8300
catch_up = 1000
