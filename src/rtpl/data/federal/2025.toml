# Federal tax law for tax year 2025.
#
# Every value here is plain data: edit it, or copy this file to your user
# tax-law folder and edit the copy, without touching any code.
# Bracket lists are [lower_bound, rate] pairs, sorted ascending.
# Filing status keys: single, mfj (married filing jointly), mfs (married
# filing separately), hoh (head of household). Qualifying surviving spouse
# uses the mfj values.

year = 2025
status = "enacted"
sources = [
  "IRS Rev. Proc. 2024-40 (inflation adjustments)",
  "One Big Beautiful Bill Act, P.L. 119-21 (OBBBA) section 70101-70103",
  "CMS 2025 Medicare Parts B and D premium fact sheets",
  "HHS 2024 poverty guidelines (used for 2025 ACA coverage)",
]

[policy]
# TCJA-era rules made permanent by OBBBA. Flip these to model a different law.
personal_exemption = 0.0                 # per person; 0 since TCJA, kept at 0 by OBBBA
senior_deduction = true                  # OBBBA enhanced senior deduction, 2025-2028
aca_enhanced_subsidies = true            # ARPA/IRA enhanced credits (no 400% FPL cliff)

[ordinary_brackets]
single = [[0, 0.10], [11925, 0.12], [48475, 0.22], [103350, 0.24], [197300, 0.32], [250525, 0.35], [626350, 0.37]]
mfj    = [[0, 0.10], [23850, 0.12], [96950, 0.22], [206700, 0.24], [394600, 0.32], [501050, 0.35], [751600, 0.37]]
mfs    = [[0, 0.10], [11925, 0.12], [48475, 0.22], [103350, 0.24], [197300, 0.32], [250525, 0.35], [375800, 0.37]]
hoh    = [[0, 0.10], [17000, 0.12], [64850, 0.22], [103350, 0.24], [197300, 0.32], [250500, 0.35], [626350, 0.37]]

[standard_deduction]
# OBBBA raised the 2025 amounts after Rev. Proc. 2024-40 was published.
single = 15750
mfj    = 31500
mfs    = 15750
hoh    = 23625

[additional_standard_deduction]
# Per person aged 65+ (and again per person who is blind).
unmarried = 2000
married   = 1600

[senior_deduction]
# OBBBA section 70103: "enhanced senior deduction", available to itemizers too.
amount_per_person = 6000
phaseout_rate     = 0.06
phaseout_per_person = true   # each eligible person's $6,000 shrinks by 6% of excess MAGI
first_year = 2025
last_year  = 2028
mfs_eligible = false
phaseout_start = { single = 75000, mfj = 150000, mfs = 75000, hoh = 75000 }

[capital_gains]
# Rates applied to qualified dividends and net long-term capital gains,
# stacked on top of ordinary taxable income.
single = [[0, 0.0], [48350, 0.15], [533400, 0.20]]
mfj    = [[0, 0.0], [96700, 0.15], [600050, 0.20]]
mfs    = [[0, 0.0], [48350, 0.15], [300000, 0.20]]
hoh    = [[0, 0.0], [64750, 0.15], [566700, 0.20]]
capital_loss_limit = { single = 3000, mfj = 3000, mfs = 1500, hoh = 3000 }

[niit]
# Net Investment Income Tax. Thresholds are set in statute, not indexed.
rate = 0.038
threshold = { single = 200000, mfj = 250000, mfs = 125000, hoh = 200000 }

[social_security]
# Provisional income thresholds for taxing benefits. Not indexed.
# mfs assumes the couple lived together during the year (base 0).
base     = { single = 25000, mfj = 32000, mfs = 0, hoh = 25000 }
adjusted = { single = 34000, mfj = 44000, mfs = 0, hoh = 34000 }
# Retirement earnings test (SSA's annual exempt amounts). Before the year
# of full retirement age, $1 of benefits is withheld for every $2 of
# wages over under_fra; in that year, $1 for every $3 over fra_year,
# counting only the months before full retirement age.
earnings_test = { under_fra = 23400, fra_year = 62160 }

[irmaa]
# Medicare premiums paid in 2025, set by MAGI from 2023 (two-year lookback).
# Each tier: income above `single`/`mfj`/`mfs` puts you in that tier.
# part_b and part_d are the monthly amounts per enrolled person
# (part_b is the full premium; part_d is the surcharge added to the plan premium).
premium_year = 2025
lookback_years = 2
part_b_standard = 185.00
tiers = [
  { single = 106000, mfj = 212000, mfs = 106000, part_b = 259.00, part_d = 13.70 },
  { single = 133000, mfj = 266000, mfs = 106000, part_b = 370.00, part_d = 35.30 },
  { single = 167000, mfj = 334000, mfs = 106000, part_b = 480.90, part_d = 57.00 },
  { single = 200000, mfj = 400000, mfs = 106000, part_b = 591.90, part_d = 78.60 },
  { single = 500000, mfj = 750000, mfs = 394000, part_b = 628.90, part_d = 85.80 },
]

[aca]
# Premium tax credit reference points for marketplace coverage in 2025.
fpl_first_person = 15060
fpl_each_additional = 5380
medicaid_expansion_pct = 1.38
csr_limit_pct = 2.50
subsidy_cliff_pct = 4.00   # only a cliff when policy.aca_enhanced_subsidies is false
# Premium tax credit: the share of income expected toward the benchmark
# (second-lowest-cost Silver) plan, by income as a multiple of the
# poverty line: [band start, initial %, final %], rising in a straight
# line across each band (Inflation Reduction Act section 12001 (enhanced credits)).
applicable_percentage = [[0.0, 0.0, 0.0], [1.5, 0.0, 0.02], [2.0, 0.02, 0.04], [2.5, 0.04, 0.06], [3.0, 0.06, 0.085], [4.0, 0.085, 0.085]]

[education_credits]
# American Opportunity credit (IRC 25A(b), (i)): per student, 100% of the
# first $2,000 of qualified expenses plus 25% of the next $2,000; 40% of it
# is refundable. Lifetime Learning credit: 20% of up to $10,000 of expenses
# per return, nonrefundable. Both phase out in a straight line over the
# MAGI range below (fixed in statute, not indexed). Married filing
# separately can't claim either.
aotc_full_expenses = 2000
aotc_partial_expenses = 2000
aotc_partial_rate = 0.25
aotc_refundable_share = 0.40
aotc_phaseout_start = { single = 80000, mfj = 160000, mfs = 0, hoh = 80000 }
aotc_phaseout_width = { single = 10000, mfj = 20000, mfs = 0, hoh = 10000 }
llc_rate = 0.20
llc_expense_limit = 10000
llc_phaseout_start = { single = 80000, mfj = 160000, mfs = 0, hoh = 80000 }
llc_phaseout_width = { single = 10000, mfj = 20000, mfs = 0, hoh = 10000 }

[qcd]
# Qualified charitable distributions (IRC 408(d)(8)): the most each IRA
# owner aged 70 1/2 or older can give from their IRAs tax-free this year.
# Indexed for inflation (IRS Notice 2024-80).
annual_limit = 108000
# SECURE 2.0 one-time gift to a charitable gift annuity or remainder
# trust (from 2023; inside the annual limit). 0 = not yet allowed.
split_interest_limit = 54000

[hsa]
# Health savings account contribution limits (IRC 223(b)), for someone
# covered by a high-deductible health plan all year and not on Medicare.
# Indexed for inflation (Rev. Proc. 2024-25). The catch-up for those 55 or older
# by the end of the year is fixed in statute and goes only into the HSA
# of the person it belongs to.
self_only = 4300
family = 8550
catch_up = 1000

# Form 1040-ES (IRC 6654): a quarter of the required annual payment for each
# period. A due date on a Saturday, Sunday or legal holiday in the District
# of Columbia moves to the next business day (IRC 7503).
[estimated_payments]
installments = [
  { due = "04-15", share = 0.25 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]

# Safe harbors against the underpayment penalty (IRC 6654(d), Form 2210),
# fixed in statute. The required annual payment is the smaller of
# current_year_share of this year's tax and prior_year_share of last year's
# (high_income_prior_year_share when last year's AGI was over
# high_income_agi). No penalty when the tax not covered by withholding is
# under penalty_floor (IRC 6654(e)(1)).
[estimated_payments.safe_harbor]
current_year_share = 0.90
prior_year_share = 1.00
high_income_prior_year_share = 1.10
high_income_agi = { single = 150000, mfj = 150000, mfs = 75000, hoh = 150000 }
penalty_floor = 1000
