# Federal tax law for tax year 2027. See 2025.toml for the format notes.
#
# Every amount here is official: the IRS published the 2027 inflation
# adjustments in Rev. Proc. 2026-35 and CMS announced the 2027 Medicare
# premiums before this file was written. Values that are fixed in statute
# (NIIT, Social Security thresholds, the senior deduction) carry over.
# Two items are less firm and are marked below: the Part D IRMAA amounts
# (taken from summaries of the CMS release) and the ACA settings.

year = 2027
status = "enacted"
sources = [
  "IRS Rev. Proc. 2026-35 (inflation adjustments for 2027, published Nov. 2026)",
  "One Big Beautiful Bill Act, P.L. 119-21 (OBBBA)",
  "CMS 2027 Medicare Parts B and D premium fact sheet (announced Nov. 17, 2026)",
  "HHS 2026 poverty guidelines (used for 2027 ACA coverage)",
]

[policy]
personal_exemption = 0.0
senior_deduction = true
# The enhanced ACA credits expired after 2025, so the 400% FPL cliff applies.
# Set this to true if Congress restores them.
aca_enhanced_subsidies = false

[ordinary_brackets]
single = [[0, 0.10], [12800, 0.12], [52025, 0.22], [109125, 0.24], [208325, 0.32], [264550, 0.35], [661375, 0.37]]
mfj    = [[0, 0.10], [25600, 0.12], [104050, 0.22], [218250, 0.24], [416650, 0.32], [529100, 0.35], [793650, 0.37]]
mfs    = [[0, 0.10], [12800, 0.12], [52025, 0.22], [109125, 0.24], [208325, 0.32], [264550, 0.35], [396825, 0.37]]
hoh    = [[0, 0.10], [18250, 0.12], [69650, 0.22], [109100, 0.24], [208300, 0.32], [264550, 0.35], [661350, 0.37]]

[standard_deduction]
single = 16600
mfj    = 33200
mfs    = 16600
hoh    = 24925

[additional_standard_deduction]
unmarried = 2100
married   = 1700

[senior_deduction]
amount_per_person = 6000
phaseout_rate     = 0.06
phaseout_per_person = true
first_year = 2025
last_year  = 2028
mfs_eligible = false
phaseout_start = { single = 75000, mfj = 150000, mfs = 75000, hoh = 75000 }

[capital_gains]
single = [[0, 0.0], [51050, 0.15], [563200, 0.20]]
mfj    = [[0, 0.0], [102100, 0.15], [633600, 0.20]]
mfs    = [[0, 0.0], [51050, 0.15], [316800, 0.20]]
hoh    = [[0, 0.0], [68350, 0.15], [598400, 0.20]]
capital_loss_limit = { single = 3000, mfj = 3000, mfs = 1500, hoh = 3000 }

[niit]
rate = 0.038
threshold = { single = 200000, mfj = 250000, mfs = 125000, hoh = 200000 }

[social_security]
base     = { single = 25000, mfj = 32000, mfs = 0, hoh = 25000 }
adjusted = { single = 34000, mfj = 44000, mfs = 0, hoh = 34000 }
earnings_test = { under_fra = 25560, fra_year = 67920 }

[irmaa]
# Medicare premiums paid in 2027, set by MAGI from 2025.
# Part B amounts and thresholds: CMS. Part D surcharges: as reported in
# summaries of the CMS release; check against the CMS fact sheet.
premium_year = 2027
lookback_years = 2
part_b_standard = 209.40
tiers = [
  { single = 112000, mfj = 224000, mfs = 112000, part_b = 293.10, part_d = 15.40 },
  { single = 141000, mfj = 282000, mfs = 112000, part_b = 418.80, part_d = 39.70 },
  { single = 177000, mfj = 354000, mfs = 112000, part_b = 544.40, part_d = 64.00 },
  { single = 212000, mfj = 424000, mfs = 112000, part_b = 670.00, part_d = 88.30 },
  { single = 500000, mfj = 750000, mfs = 388000, part_b = 711.80, part_d = 96.40 },
]

[aca]
fpl_first_person = 15960
fpl_each_additional = 5680
medicaid_expansion_pct = 1.38
csr_limit_pct = 2.50
subsidy_cliff_pct = 4.00
# Premium tax credit: the share of income expected toward the benchmark
# (second-lowest-cost Silver) plan, by income as a multiple of the
# poverty line: [band start, initial %, final %], rising in a straight
# line across each band (Rev. Proc. 2026-26).
applicable_percentage = [[0.0, 0.0215, 0.0215], [1.33, 0.0323, 0.043], [1.5, 0.043, 0.0678], [2.0, 0.0678, 0.0866], [2.5, 0.0866, 0.1022], [3.0, 0.1022, 0.1022]]

[education_credits]
# American Opportunity credit (IRC 25A(b), (i)): per student, 100% of the
# first $2,000 of qualified expenses plus 25% of the next $2,000; 40% of it
# is refundable. Lifetime Learning credit: 20% of up to $10,000 of expenses
# per return, nonrefundable. Both phase out in a straight line over the
# MAGI range below (fixed in statute, not indexed). Married filing
# separately can't claim either.
aotc_full_expenses = 2000
aotc_partial_expenses = 2000
aotc_partial_rate = 0.25
aotc_refundable_share = 0.40
aotc_phaseout_start = { single = 80000, mfj = 160000, mfs = 0, hoh = 80000 }
aotc_phaseout_width = { single = 10000, mfj = 20000, mfs = 0, hoh = 10000 }
llc_rate = 0.20
llc_expense_limit = 10000
llc_phaseout_start = { single = 80000, mfj = 160000, mfs = 0, hoh = 80000 }
llc_phaseout_width = { single = 10000, mfj = 20000, mfs = 0, hoh = 10000 }

[charitable]
# Cash gifts to charity deducted by those who take the standard deduction
# (IRC 170(p), added by OBBBA for tax years after 2025). The deduction
# lowers taxable income but not AGI. Cash only, to public charities, not to
# donor-advised funds or supporting organizations. Fixed in statute, not
# indexed. A qualifying surviving spouse files no joint return, so takes the
# single amount.
nonitemizer_first_year = 2026
nonitemizer_limit = { single = 1000, mfj = 2000, mfs = 1000, hoh = 1000 }

[qcd]
# Qualified charitable distributions (IRC 408(d)(8)): the most each IRA
# owner aged 70 1/2 or older can give from their IRAs tax-free this year.
# Indexed for inflation (IRS Notice 2026-66).
annual_limit = 114000
# SECURE 2.0 one-time gift to a charitable gift annuity or remainder
# trust (from 2023; inside the annual limit). 0 = not yet allowed.
split_interest_limit = 57000

[hsa]
# Health savings account contribution limits (IRC 223(b)), for someone
# covered by a high-deductible health plan all year and not on Medicare.
# Indexed for inflation (Rev. Proc. 2026-24). The catch-up for those 55 or older
# by the end of the year is fixed in statute and goes only into the HSA
# of the person it belongs to.
self_only = 4500
family = 9000
catch_up = 1000

# Form 1040-ES (IRC 6654): a quarter of the required annual payment for each
# period. A due date on a Saturday, Sunday or legal holiday in the District
# of Columbia moves to the next business day (IRC 7503).
[estimated_payments]
installments = [
  { due = "04-15", share = 0.25 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]

# Safe harbors against the underpayment penalty (IRC 6654(d), Form 2210),
# fixed in statute. The required annual payment is the smaller of
# current_year_share of this year's tax and prior_year_share of last year's
# (high_income_prior_year_share when last year's AGI was over
# high_income_agi). No penalty when the tax not covered by withholding is
# under penalty_floor (IRC 6654(e)(1)).
[estimated_payments.safe_harbor]
current_year_share = 0.90
prior_year_share = 1.00
high_income_prior_year_share = 1.10
high_income_agi = { single = 150000, mfj = 150000, mfs = 75000, hoh = 150000 }
penalty_floor = 1000
