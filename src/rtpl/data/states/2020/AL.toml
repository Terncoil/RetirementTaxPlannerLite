# Alabama personal income tax, 2020.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "AL"
name = "Alabama"
year = 2020
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2020 (PDF)",
]
taxes_social_security = false
notes = [
  "Defined-benefit pensions are exempt; $6,000 of other retirement income at 65+.",
  "Standard deduction phases down with income; federal income tax deduction not modelled.",
]

[brackets]
single = [[0, 0.02], [500, 0.04], [3000, 0.05]]
mfj    = [[0, 0.02], [1000, 0.04], [6000, 0.05]]

[standard_deduction]
single = 2500
mfj    = 7500

[exemption]
per_person = 1500

[[retirement_exclusions]]
amount = "unlimited"
applies_to = ["pension"]

[[retirement_exclusions]]
amount = 6000
min_age = 65
applies_to = ["ira"]

# Form 40ES: the federal due dates, a quarter each.
[estimated_payments]
notes = [
  "The Department's FAQ page lists December 15 for the fourth payment; the Form 40ES instructions give January 15, which is used here.",
  "2020: COVID-19 relief moved the first two installments to July 15, 2020 (Tax Foundation table of state actions as of May 19, 2020).",
]
installments = [
  { due = "04-15", share = 0.25, due_date = 2020-07-15 },
  { due = "06-15", share = 0.25, due_date = 2020-07-15 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
