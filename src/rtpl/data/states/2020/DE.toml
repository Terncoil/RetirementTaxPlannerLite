# Delaware personal income tax, 2020.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "DE"
name = "Delaware"
year = 2020
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2020 (PDF)",
]
taxes_social_security = false
notes = [
  "Personal exemption is a $110 credit per person; additional 65+ deduction not modelled.",
]

[brackets]
single = [[0, 0], [2000, 0.022], [5000, 0.039], [10000, 0.048], [20000, 0.052], [25000, 0.0555], [60000, 0.066]]
mfj    = [[0, 0], [2000, 0.022], [5000, 0.039], [10000, 0.048], [20000, 0.052], [25000, 0.0555], [60000, 0.066]]

[standard_deduction]
single = 3250
mfj    = 6500

[exemption]
credit_per_person = 110

[[retirement_exclusions]]
amount = 12500
min_age = 60
