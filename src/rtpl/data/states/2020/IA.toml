# Iowa personal income tax, 2020.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "IA"
name = "Iowa"
year = 2020
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2020 (PDF)",
]
taxes_social_security = false
notes = [
  "Pension/IRA exclusion $6,000 per person at 55+. Deduction for federal income tax paid not modelled.",
]

[brackets]
single = [[0, 0.0033], [1638, 0.0067], [3276, 0.0225], [6552, 0.0414], [14742, 0.0563], [24570, 0.0596], [32760, 0.0625], [49140, 0.0744], [73710, 0.0853]]
mfj    = [[0, 0.0033], [1638, 0.0067], [3276, 0.0225], [6552, 0.0414], [14742, 0.0563], [24570, 0.0596], [32760, 0.0625], [49140, 0.0744], [73710, 0.0853]]

[standard_deduction]
single = 2080
mfj    = 5120

[exemption]
credit_per_person = 40

[[retirement_exclusions]]
amount = 6000
min_age = 55

# Form IA 1040ES (Iowa Admin. Code 701-308.2): due the last day of the month.
[estimated_payments]
notes = [
  "Iowa's installments are due April 30, June 30, September 30 and January 31, later than the federal dates.",
  "2020: Iowa kept its due dates and offered conditional penalty relief for COVID-19.",
]
installments = [
  { due = "04-30", share = 0.25 },
  { due = "06-30", share = 0.25 },
  { due = "09-30", share = 0.25 },
  { due = "01-31", share = 0.25 },
]
