# Indiana personal income tax, 2020.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "IN"
name = "Indiana"
year = 2020
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2020 (PDF)",
]
taxes_social_security = false
notes = [
  "County income taxes (about 1-3%) not modelled; $1,000 extra exemption at 65+ not modelled.",
]

[brackets]
single = [[0, 0.0323]]
mfj    = [[0, 0.0323]]

[standard_deduction]
single = 0
mfj    = 0

[exemption]
per_person = 1000

# Form ES-40: the federal due dates, a quarter each.
[estimated_payments]
notes = [
  "2020: COVID-19 relief moved the first installment to July 15, 2020; the second stayed due June 15 (Tax Foundation table as of May 19, 2020).",
]
installments = [
  { due = "04-15", share = 0.25, due_date = 2020-07-15 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
