# Mississippi personal income tax, 2020.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "MS"
name = "Mississippi"
year = 2020
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2020 (PDF)",
]
taxes_social_security = false
notes = [
  "Qualified retirement income exempt (age 59½ for IRAs).",
]

[brackets]
single = [[0, 0], [3000, 0.03], [5000, 0.04], [10000, 0.05]]
mfj    = [[0, 0], [3000, 0.03], [5000, 0.04], [10000, 0.05]]

[standard_deduction]
single = 2300
mfj    = 4600

[exemption]
per_person = 6000

[[retirement_exclusions]]
amount = "unlimited"
min_age = 60

# Form 80-106: the federal due dates, a quarter each.
[estimated_payments]
notes = [
  "2020: COVID-19 relief moved the first two installments to July 15, 2020 (Tax Foundation table of state actions as of May 19, 2020).",
]
installments = [
  { due = "04-15", share = 0.25, due_date = 2020-07-15 },
  { due = "06-15", share = 0.25, due_date = 2020-07-15 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
