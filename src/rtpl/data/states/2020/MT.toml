# Montana personal income tax, 2020.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "MT"
name = "Montana"
year = 2020
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2020 (PDF)",
]
taxes_social_security = true
notes = [
  "Before 2024: capital gains taxed as ordinary income (the 2% capital gains credit is not modelled); standard deduction is 20% of AGI between limits (modelled as the maximum); pension exclusion and federal tax deduction not modelled.",
  "Social Security taxed as federally (Montana's own formula not modelled).",
]

[brackets]
single = [[0, 0.01], [3100, 0.02], [5400, 0.03], [8200, 0.04], [11100, 0.05], [14300, 0.06], [18400, 0.069]]
mfj    = [[0, 0.01], [3100, 0.02], [5400, 0.03], [8200, 0.04], [11100, 0.05], [14300, 0.06], [18400, 0.069]]

[standard_deduction]
single = 4710
mfj    = 9420

[exemption]
per_person = 2510

# Form ESW: the federal due dates, a quarter each.
[estimated_payments]
notes = [
  "2020: COVID-19 relief moved the first two installments to July 15, 2020 (Tax Foundation table of state actions as of May 19, 2020).",
]
installments = [
  { due = "04-15", share = 0.25, due_date = 2020-07-15 },
  { due = "06-15", share = 0.25, due_date = 2020-07-15 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
