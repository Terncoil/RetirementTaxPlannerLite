# New Jersey personal income tax, 2020.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "NJ"
name = "New Jersey"
year = 2020
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2020 (PDF)",
  "NJ Division of Taxation, Retirement Income (pension exclusion), 2025 NJ-1040",
]
taxes_social_security = false
taxes_hsa_contributions = true
notes = [
  "Pension/IRA exclusion at 62+: up to $100,000 joint / $75,000 single with total income to $100K, none above (a cliff; the partial exclusion to $150K starts in 2021). Total income is taken as AGI less taxable Social Security.",
  "Extra $1,000 exemption at 65+ (each spouse on a joint return).",
  "Other retirement income exclusion (unused pension exclusion applied to other income) not modelled.",
]

[brackets]
single = [[0, 0.014], [20000, 0.0175], [35000, 0.035], [40000, 0.05525], [75000, 0.0637], [500000, 0.0897], [1000000, 0.1075]]
mfj    = [[0, 0.014], [20000, 0.0175], [50000, 0.0245], [70000, 0.035], [80000, 0.05525], [150000, 0.0637], [500000, 0.0897], [1000000, 0.1075]]

[standard_deduction]
single = 0
mfj    = 0

[exemption]
per_person = 1000

# Senior exemption: $1,000 more for each person 65 or older.
[age_deduction]
amount = 1000
min_age = 65

[[retirement_exclusions]]
min_age = 62
per_return = { single = 75000, mfj = 100000, mfs = 50000, hoh = 75000 }
phaseout = { income = "agi_ex_ss", start = { single = 100000, mfj = 100000 } }

# Form NJ-1040-ES: the federal due dates, a quarter each.
[estimated_payments]
notes = [
  "2020: COVID-19 relief moved the first installment to July 15, 2020; the second stayed due June 15 (Tax Foundation table as of May 19, 2020).",
]
installments = [
  { due = "04-15", share = 0.25, due_date = 2020-07-15 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
