# South Carolina personal income tax, 2020.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "SC"
name = "South Carolina"
year = 2020
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2020 (PDF)",
]
taxes_social_security = false
capital_gains_exclusion = 0.44
notes = [
  "$15,000 deduction per person at 65+ (combined with the retirement deduction).",
  "44% of net capital gains excluded.",
]

[brackets]
single = [[0, 0.0], [3070, 0.03], [6150, 0.04], [9230, 0.05], [12310, 0.06], [15400, 0.07]]
mfj    = [[0, 0.0], [3070, 0.03], [6150, 0.04], [9230, 0.05], [12310, 0.06], [15400, 0.07]]

[standard_deduction]
single = 12400
mfj    = 24800

[age_deduction]
amount = 15000
min_age = 65
