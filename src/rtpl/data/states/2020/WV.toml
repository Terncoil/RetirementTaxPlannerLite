# West Virginia personal income tax, 2020.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "WV"
name = "West Virginia"
year = 2020
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2020 (PDF)",
]
taxes_social_security = true
notes = [
  "Social Security exempt with AGI up to $50,000 single / $100,000 joint; above, 0% exempt (fully exempt from 2026); senior income modification not modelled.",
]

[brackets]
single = [[0, 0.03], [10000, 0.04], [25000, 0.045], [40000, 0.06], [60000, 0.065]]
mfj    = [[0, 0.03], [10000, 0.04], [25000, 0.045], [40000, 0.06], [60000, 0.065]]

[standard_deduction]
single = 0
mfj    = 0

[exemption]
per_person = 2000

[social_security]
exempt_if_agi_at_most = { single = 50000, mfj = 100000 }
exempt_fraction_above = 0.0
