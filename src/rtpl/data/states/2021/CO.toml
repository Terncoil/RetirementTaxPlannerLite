# Colorado personal income tax, 2021.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "CO"
name = "Colorado"
year = 2021
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2021",
  "Colorado DOR, Social Security, Pensions, and Annuities (Jan 2025)",
]
taxes_social_security = true
notes = [
  "Pension/annuity subtraction $24,000 at 65+ (it also covers Social Security, which is modelled as taxed; $20,000 at 55-64 not modelled).",
]

[brackets]
single = [[0, 0.0455]]
mfj    = [[0, 0.0455]]

[standard_deduction]
single = 12550
mfj    = 25100

[[retirement_exclusions]]
amount = 24000
min_age = 65

# Form DR 0104EP: the federal due dates, a quarter each.
[estimated_payments]
installments = [
  { due = "04-15", share = 0.25 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
