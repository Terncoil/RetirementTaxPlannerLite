# Maryland personal income tax, 2021.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "MD"
name = "Maryland"
year = 2021
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2021",
]
taxes_social_security = false
notes = [
  "County income taxes (2.25-3.2%) not modelled; pension exclusion at 65+ not modelled. Standard deduction is 15% of income between limits (modelled as the maximum).",
]

[brackets]
single = [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.0475], [100000, 0.05], [125000, 0.0525], [150000, 0.055], [250000, 0.0575]]
mfj    = [[0, 0.02], [1000, 0.03], [2000, 0.04], [3000, 0.0475], [150000, 0.05], [175000, 0.0525], [225000, 0.055], [300000, 0.0575]]

[standard_deduction]
single = 2300
mfj    = 4650

[exemption]
per_person = 3200

# Form PV (502D): the federal due dates, a quarter each.
[estimated_payments]
installments = [
  { due = "04-15", share = 0.25 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
