# Rhode Island personal income tax, 2021.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "RI"
name = "Rhode Island"
year = 2021
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2021",
  "2025 RI-1040 instructions and worksheets (phase-out, Social Security and pension modification limits)",
]
taxes_social_security = true
notes = [
  "Social Security and pension modifications need full retirement age (modelled as 67) and AGI up to $88,950 single / $111,200 joint (cliffs); the pension modification ($15,000) excludes IRAs.",
  "Standard deduction and exemptions fall 20% for each $7,250 of AGI over about $210,750 (approximate for 2022 and 2024).",
]

[brackets]
single = [[0, 0.0375], [66200, 0.0475], [150550, 0.0599]]
mfj    = [[0, 0.0375], [66200, 0.0475], [150550, 0.0599]]

[standard_deduction]
single = 9050
mfj    = 18100
phaseout = { start = { single = 210750, mfj = 210750 }, step = 7250, step_fraction = 0.2 }

[exemption]
per_person = 4250
phaseout = { start = { single = 210750, mfj = 210750 }, step = 7250, step_fraction = 0.2 }

[social_security]
exempt_if_agi_at_most = { single = 88950, mfj = 111200 }

[[retirement_exclusions]]
amount = 15000
min_age = 67
applies_to = ["pension"]
phaseout = { start = { single = 88950, mfj = 111200 } }
