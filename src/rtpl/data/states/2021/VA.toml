# Virginia personal income tax, 2021.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "VA"
name = "Virginia"
year = 2021
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2021",
  "Va. Code 58.1-322.03 and Form 760 instructions (age deduction)",
]
taxes_social_security = false
notes = [
  "Age deduction of $12,000 at 65+ falls $1 per $1 of AGI less taxable Social Security over $50,000 single / $75,000 married (for the couple together); the unreduced deduction for those born before Jan 2, 1939 is not modelled.",
]

[brackets]
single = [[0, 0.02], [3000, 0.03], [5000, 0.05], [17000, 0.0575]]
mfj    = [[0, 0.02], [3000, 0.03], [5000, 0.05], [17000, 0.0575]]

[standard_deduction]
single = 4500
mfj    = 9000

[exemption]
per_person = 930

[age_deduction]
amount = 12000
min_age = 65
phaseout = { start = { single = 50000, mfj = 75000, mfs = 75000 }, rate = 1, income = "agi_ex_ss" }

# Form 760ES: the first installment is due May 1 and covers income through
# April 30 (Form 760C annualizes January 1 to April 30; 23VAC10-112-43).
[estimated_payments]
notes = [
  "Virginia's first installment is due May 1, later than the federal April 15.",
  "Virginia's first period runs from January 1 to April 30, a month longer than the federal one, so income through April 30 counts toward the May 1 payment.",
]
installments = [
  { due = "05-01", period_end = "04-30", share = 0.25 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
