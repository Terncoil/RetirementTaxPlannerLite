# Maine personal income tax, 2022.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "ME"
name = "Maine"
year = 2022
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2022",
]
taxes_social_security = false
notes = [
  "Pension deduction (reduced by Social Security) not modelled.",
]

[brackets]
single = [[0, 0.058], [23000, 0.0675], [54450, 0.0715]]
mfj    = [[0, 0.058], [46000, 0.0675], [108900, 0.0715]]

[standard_deduction]
single = 12950
mfj    = 25900

[exemption]
per_person = 4450

# Form 1040ES-ME: the federal due dates, a quarter each.
[estimated_payments]
holidays = ["federal", "patriots"]
notes = [
  "A due date on Patriots' Day (the third Monday in April) moves to the next business day.",
]
installments = [
  { due = "04-15", share = 0.25 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
