# Ohio personal income tax, 2022.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "OH"
name = "Ohio"
year = 2022
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2022",
  "Ohio Rev. Code 5747.025 (personal exemption by income)",
]
taxes_social_security = false
notes = [
  "Exemption $2,400 per person with income to $40K, $2,150 to $80K, $1,900 above (steps). Retirement and senior credits and municipal income taxes not modelled.",
]

[brackets]
single = [[0, 0], [25000, 0.02765], [44250, 0.03226], [88450, 0.03688], [110650, 0.0399]]
mfj    = [[0, 0], [25000, 0.02765], [44250, 0.03226], [88450, 0.03688], [110650, 0.0399]]

[standard_deduction]
single = 0
mfj    = 0

[exemption]
per_person = 2400
phaseout = { income = "state_income", tiers = [{ up_to = { single = 40000, mfj = 40000 }, keep = 1 }, { up_to = { single = 80000, mfj = 80000 }, keep = 0.895833 }, { up_to = {  }, keep = 0.791667 }] }
