# Pennsylvania personal income tax, 2022.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "PA"
name = "Pennsylvania"
year = 2022
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets for 2022",
]
taxes_social_security = false
notes = [
  "Retirement income exempt after retirement age (59½ for IRAs). Local earned income taxes not modelled.",
]

[brackets]
single = [[0, 0.0307]]
mfj    = [[0, 0.0307]]

[standard_deduction]
single = 0
mfj    = 0

[[retirement_exclusions]]
amount = "unlimited"
min_age = 60

# Form PA-40 ES: the federal due dates, a quarter each.
# PA's own instructions could not be reached when this was written;
# these are the dates the PA-40 ES vouchers have long used.
[estimated_payments]
installments = [
  { due = "04-15", share = 0.25 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
