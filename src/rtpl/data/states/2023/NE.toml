# Nebraska personal income tax, 2023.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "NE"
name = "Nebraska"
year = 2023
sources = [
  "Tax Foundation, 2023 State Income Tax Rates and Brackets",
]
taxes_social_security = true
notes = [
  "Social Security exempt with AGI up to about $44,460 single / $59,100 joint (2020 limits); above, 60% exempt (fully exempt from 2024).",
]

[brackets]
single = [[0, 0.0246], [3700, 0.0351], [22170, 0.0501], [35730, 0.0664]]
mfj    = [[0, 0.0246], [7390, 0.0351], [44350, 0.0501], [71460, 0.0664]]

[standard_deduction]
single = 7900
mfj    = 15800

[exemption]
credit_per_person = 157

[social_security]
exempt_if_agi_at_most = { single = 44460, mfj = 59100 }
exempt_fraction_above = 0.6
