# Vermont personal income tax, 2023.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "VT"
name = "Vermont"
year = 2023
sources = [
  "Tax Foundation, 2023 State Income Tax Rates and Brackets",
]
taxes_social_security = true
notes = [
  "Social Security exemption limits approximated; capital gains exclusion not modelled.",
]

[brackets]
single = [[0, 0.0335], [42150, 0.066], [102200, 0.076], [213150, 0.0875]]
mfj    = [[0, 0.0335], [70450, 0.066], [170300, 0.076], [259500, 0.0875]]

[standard_deduction]
single = 6500
mfj    = 13050

[exemption]
per_person = 4500

[social_security]
exempt_if_agi_at_most = { single = 50000, mfj = 65000 }
phaseout_width = { single = 10000, mfj = 10000 }
