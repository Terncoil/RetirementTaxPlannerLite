# District of Columbia personal income tax, 2025.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "DC"
name = "District of Columbia"
year = 2025
sources = [
  "Tax Foundation, 2025 State Income Tax Rates and Brackets",
]
taxes_social_security = false
notes = []

[brackets]
single = [[0, 0.04], [10000, 0.06], [40000, 0.065], [60000, 0.085], [250000, 0.0925], [500000, 0.0975], [1000000, 0.1075]]
mfj    = [[0, 0.04], [10000, 0.06], [40000, 0.065], [60000, 0.085], [250000, 0.0925], [500000, 0.0975], [1000000, 0.1075]]

[standard_deduction]
single = 15000
mfj    = 30000

# Form D-40ES: the federal due dates, a quarter each.
[estimated_payments]
notes = [
  "Required when the tax owed is expected to be $100 or more.",
]
installments = [
  { due = "04-15", share = 0.25 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
