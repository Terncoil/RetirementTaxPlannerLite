# North Dakota personal income tax, 2025.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "ND"
name = "North Dakota"
year = 2025
sources = [
  "Tax Foundation, 2025 State Income Tax Rates and Brackets",
]
taxes_social_security = false
capital_gains_exclusion = 0.4
notes = []

[brackets]
single = [[0, 0], [48475, 0.0195], [244825, 0.025]]
mfj    = [[0, 0], [80975, 0.0195], [298075, 0.025]]

[standard_deduction]
single = 15000
mfj    = 30000

# Form ND-1ES: the federal due dates, a quarter each.
[estimated_payments]
notes = [
  "Required when federal estimates are required and this year's and last year's tax not covered by withholding are each $1,000 or more.",
]
installments = [
  { due = "04-15", share = 0.25 },
  { due = "06-15", share = 0.25 },
  { due = "09-15", share = 0.25 },
  { due = "01-15", share = 0.25 },
]
