# Rhode Island personal income tax, 2025.
# Built from the sources below and the 2026 file's retiree rules, changed
# where the law differed this year; edit freely. hoh and mfs use the
# single values unless listed. Rates enacted later in the year but
# applying to all of it replace the table's (as of Jan 1) rates.

code = "RI"
name = "Rhode Island"
year = 2025
sources = [
  "Tax Foundation, 2025 State Income Tax Rates and Brackets",
  "2025 RI-1040 instructions and worksheets (phase-out, Social Security and pension modification limits)",
]
taxes_social_security = true
notes = [
  "Social Security and pension modifications need full retirement age (modelled as 67) and AGI up to $107,000 single / $133,750 joint (cliffs); the pension modification ($50,000) excludes IRAs.",
  "Standard deduction and exemptions fall 20% for each $7,250 of AGI over about $254,250 (approximate for 2022 and 2024).",
]

[brackets]
single = [[0, 0.0375], [79900, 0.0475], [181650, 0.0599]]
mfj    = [[0, 0.0375], [79900, 0.0475], [181650, 0.0599]]

[standard_deduction]
single = 10900
mfj    = 21800
phaseout = { start = { single = 254250, mfj = 254250 }, step = 7250, step_fraction = 0.2 }

[exemption]
per_person = 5100
phaseout = { start = { single = 254250, mfj = 254250 }, step = 7250, step_fraction = 0.2 }

[social_security]
exempt_if_agi_at_most = { single = 107000, mfj = 133750 }

[[retirement_exclusions]]
amount = 50000
min_age = 67
applies_to = ["pension"]
phaseout = { start = { single = 107000, mfj = 133750 } }
