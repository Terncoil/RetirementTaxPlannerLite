# Minnesota personal income tax, 2026.
# Generated from the sources below; edit freely. hoh and mfs use the
# single values unless listed.

code = "MN"
name = "Minnesota"
year = 2026
sources = ["Tax Foundation, State Individual Income Tax Rates and Brackets, 2026 (Jan 1, 2026)"]
taxes_social_security = true
notes = [
