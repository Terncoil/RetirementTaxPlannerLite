# Washington: no tax on wages or retirement income. A capital gains excise
# tax applies to long-term gains above a yearly standard deduction.

code = "WA"
name = "Washington"
year = 2026
sources = [
  "WA Dept. of Revenue capital gains excise tax (RCW 82.87); 9.9% tier over $1M added by 2025 legislation",
  "WA Dept. of Revenue, Do you owe capital gains tax? (updated amounts: 2026 standard deduction)",
]
has_income_tax = false
taxes_social_security = false
notes = [
  "Only long-term capital gains are taxed; qualified dividends, interest and retirement income are not.",
  "Real estate, retirement accounts and some business interests are exempt, but the profile's long-term gains are all treated as taxable.",
  "The 9.9% income tax on income over $1M (SB 6346) starts in 2028 and is under legal challenge; not modelled yet.",
]

[capital_gains_tax]
deduction = 290000
brackets = [[0, 0.07], [1000000, 0.099]]

# Capital gains excise tax: no quarterly payments; paid with the return,
# due the same day as the federal return (RCW 82.87.110).
[estimated_payments]
required = false
annual_only = true
notes = [
  "Washington's capital gains tax has no quarterly estimated payments; it is paid once, with the return, by the federal return's due date.",
  "From tax year 2026 the tax can be prepaid up to six months before the due date.",
]
installments = [
  { due = "04-15", share = 1.00 },
]
