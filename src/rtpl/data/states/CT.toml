# Connecticut personal income tax, 2026.
# Generated from the sources below; edit freely. hoh and mfs use the
# single values unless listed.

code = "CT"
name = "Connecticut"
year = 2026
sources = [
  "Tax Foundation, State Individual Income Tax Rates and Brackets, 2026 (Jan 1, 2026)",
  "CT OLR report 2025-R-0152 (pension, IRA and Social Security deductions)",
]
taxes_social_security = true
notes = [
  "Personal exemption falls $1,000 for each $1,000 of income over the limit; modelled as a smooth $1 per $1. The personal tax credit is not modelled.",
  "Pension and IRA income is fully deductible with AGI under $75,000 single / $100,000 joint, then a falling share in steps (cliffs) to $100,000 / $150,000. Benefit recapture not modelled.",
]

[brackets]
single = [[0, 0.02], [10000, 0.045], [50000, 0.055], [100000, 0.06], [200000, 0.065], [250000, 0.069], [500000, 0.0699]]
mfj    = [[0, 0.02], [20000, 0.045], [100000, 0.055], [200000, 0.06], [400000, 0.065], [500000, 0.069], [1000000, 0.0699]]

# The personal exemption is one amount per return, so it is given here.
[standard_deduction]
single = 15000
mfj    = 24000
hoh    = 19000
mfs    = 12000
phaseout = { start = { single = 30000, mfj = 48000, hoh = 38000, mfs = 24000 }, rate = 1.0, income = "state_income" }

[social_security]
exempt_if_agi_at_most = { single = 75000, mfj = 100000 }
exempt_fraction_above = 0.75

