# Default chart colors. Copy this file to your user themes folder to change
# any color; missing keys fall back to these values.
#
# The layer colors are a colorblind-checked categorical set, stepped
# separately for light and dark backgrounds. Stack order (bottom to top) is
# ordinary, ss, cg, senior, edu, niit, state, state_cg, ptc, and the colors are
# assigned in that order so neighbouring bands stay distinguishable. nonref
# is drawn below 0%.

name = "Default"

# true = dark mode uses the [light.layers] colors too.
same_layer_colors = false

[light]
surface = "#fcfcfb"
text_primary = "#0b0b0b"
text_secondary = "#52514e"
grid = "#e4e3df"
total_line = "#0b0b0b"
irmaa = "#52514e"
aca = "#e34948"

[light.layers]
ordinary = "#2a78d6"
ss = "#eb6834"
cg = "#1baf7a"
senior = "#eda100"
niit = "#e87ba4"
state = "#008300"
state_cg = "#6250d6"
edu = "#8c564b"
ptc = "#b03fbf"
nonref = "#e6a1a1"

[dark]
surface = "#1a1a19"
text_primary = "#f0efec"
text_secondary = "#c3c2b7"
grid = "#34332f"
total_line = "#f0efec"
irmaa = "#c3c2b7"
aca = "#e66767"

[dark.layers]
ordinary = "#3987e5"
ss = "#d95926"
cg = "#199e70"
senior = "#c98500"
niit = "#d55181"
state = "#0ca30c"
state_cg = "#9085e9"
edu = "#b07a6e"
ptc = "#c66bd3"
nonref = "#d98c8c"

# Forward-looking graph: income categories, in stack order from the bottom.
# Ordinary income takes the categorical slots in order; gains and the
# tax-free segments also carry a hatch (set in the code) so no category is
# told apart by color alone.
[light.sources]
ss = "#2a78d6"
wages = "#eb6834"
pension = "#1baf7a"
other_ordinary = "#eda100"
rmd = "#e87ba4"
inherited = "#008300"
ira_withdrawal = "#6250d6"
roth_conversion = "#e34948"
dividends = "#1c5cab"
realized_gains = "#6da7ec"
tax_exempt = "#c9c7c0"
roth_withdrawal = "#aeaca5"
principal = "#dddcd7"
qcd = "#8fcfc4"

[light.lines]
bracket_low = "#898781"
bracket_high = "#0b0b0b"
deduction = "#898781"
cg0 = "#1c5cab"
irmaa = "#a3337b"
aca = "#e34948"
spending = "#0b0b0b"

[dark.sources]
ss = "#3987e5"
wages = "#d95926"
pension = "#199e70"
other_ordinary = "#c98500"
rmd = "#d55181"
inherited = "#0ca30c"
ira_withdrawal = "#9085e9"
roth_conversion = "#e66767"
dividends = "#256abf"
realized_gains = "#2ea3c9"
tax_exempt = "#5c5b56"
roth_withdrawal = "#75746e"
principal = "#45443f"
qcd = "#2c7a70"

[dark.lines]
bracket_low = "#898781"
bracket_high = "#f0efec"
deduction = "#898781"
cg0 = "#5598e7"
irmaa = "#e87ba4"
aca = "#e66767"
spending = "#f0efec"
